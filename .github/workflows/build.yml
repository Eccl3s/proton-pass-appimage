name: Build Proton Pass AppImage

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      version:
        description: "Proton Pass version to build (blank = latest stable)"
        required: false
        default: ""
      force:
        description: "Rebuild and replace assets even if the release exists"
        type: boolean
        default: false
  pull_request:              # build-only check, never publishes

permissions:
  contents: write            # create releases
  id-token: write            # build provenance attestation
  attestations: write

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION:-}" ]; then
            V="$INPUT_VERSION"
          else
            V="$(curl -fsSL https://proton.me/download/PassDesktop/linux/x64/version.json \
              | jq -r '[.Releases[] | select(.CategoryName == "Stable") | .Version] | .[]' \
              | sort -V | tail -n1)"
          fi
          [[ "$V" =~ ^[0-9]+(\.[0-9]+)*$ ]] || { echo "Bad version: $V" >&2; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && [ "${INPUT_FORCE:-false}" != "true" ]; then
            echo "Release v$V already exists; nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install build tools
        if: steps.ver.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y jq gpg zsync appstream desktop-file-utils

      - name: Build AppImage
        if: steps.ver.outputs.skip == 'false'
        run: ./build.sh "${{ steps.ver.outputs.version }}"

      - name: Check output
        if: steps.ver.outputs.skip == 'false'
        run: |
          set -euo pipefail
          ls -la dist
          A=$(ls dist/*.AppImage)
          test -s "$A.zsync"
          # Embedded update information
          ./"$A" --appimage-updateinformation 2>/dev/null || APPIMAGE_EXTRACT_AND_RUN=1 ./"$A" --appimage-updateinformation
          echo

      - name: Upload build artifact
        if: steps.ver.outputs.skip == 'false' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: dist/
          retention-days: 7

      # Attestations are only available for public repositories on free plans,
      # so this switches on automatically once the repo is made public.
      - name: Attest build provenance
        if: steps.ver.outputs.skip == 'false' && github.event_name != 'pull_request' && steps.ver.outputs.private == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.AppImage

      - name: Publish release
        if: steps.ver.outputs.skip == 'false' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.ver.outputs.version }}
          ATTESTED: ${{ steps.ver.outputs.private == 'false' }}
        run: |
          set -euo pipefail
          . dist/build-info.txt
          SHA=$(cut -d' ' -f1 dist/*.AppImage.sha256)
          {
            echo "Proton Pass **$V**, repackaged as an AppImage from Proton's official .deb."
            echo
            echo "- Upstream .deb: $deb_url"
            echo "- Upstream SHA-512 (verified at build time): \`$deb_sha512\`"
            echo "- AppImage runtime SHA-256 (GPG signature verified): \`$runtime_sha256\`"
            echo "- Built with appimagetool $appimagetool_version"
            echo "- AppImage SHA-256: \`$SHA\`"
            if [ "$ATTESTED" = "true" ]; then
              echo "- Build provenance: \`gh attestation verify Proton_Pass-$V-x86_64.AppImage --repo $GITHUB_REPOSITORY\`"
            fi
            echo
            echo "### Source code"
            echo "Proton Pass is licensed under the GNU GPL v3.0. The corresponding source for this"
            echo "version is published by Proton at"
            echo "https://github.com/ProtonMail/WebClients/tree/proton-pass@$V"
            echo "(\`applications/pass-desktop\`). The packaging scripts are in this repository."
            echo
            echo "Unofficial build, not affiliated with or endorsed by Proton AG. See the README for how to verify it."
          } > notes.md
          ASSETS=(dist/*.AppImage dist/*.AppImage.zsync dist/*.AppImage.sha256)
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v$V" "${ASSETS[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "v$V" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v$V" "${ASSETS[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "Proton Pass $V" --notes-file notes.md --latest
          fi
